];const hero=document.getElementById('hero'),status=document.getElementById('status');hero.src=frames[0];let dir=0,pos=.5,last=performance.now(),acc=0,frame=0;const pressed=new Set();function setDir(){dir=(pressed.has('right')?1:0)-(pressed.has('left')?1:0);hero.classList.toggle('left',dir<0);status.textContent=dir?'Wandelen · 8 losse beelden':'Stilstaan';if(!dir){frame=0;hero.src=frames[0];acc=0}}for(const side of ['left','right']){const el=document.getElementById(side);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);pressed.add(side);setDir()});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>{pressed.delete(side);setDir()})}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pressed.add(e.key==='ArrowLeft'?'left':'right');setDir()}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){pressed.delete(e.key==='ArrowLeft'?'left':'right');setDir()}});window.addEventListener('blur',()=>{pressed.clear();setDir()});function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(dir){pos=Math.max(.12,Math.min(.88,pos+dir*dt*.22));acc+=dt;while(acc>=.11){acc-=.11;frame=(frame+1)%8;hero.src=frames[frame]}}hero.style.left=(pos*100)+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick);
