</style></head><body><main class="wrap"><h1>SIDEWAYS · ons mannetje · 8 frames</h1><p>De acht originele figuren zijn zonder afzonderlijk schalen of uitrekken uitgesneden. De negende figuur is de herhaling van frame 1.</p><div class="stage" id="stage"><div class="ground"></div><div class="hero" id="hero"></div></div><div class="buttons"><button id="left">◀ Links</button><button id="right">Rechts ▶</button></div><p class="small" id="status">Stilstaan · pijltjestoetsen of knoppen ingedrukt houden</p></main><script>
const hero=document.getElementById('hero'),stage=document.getElementById('stage'),status=document.getElementById('status');let direction=0,pos=.5,last=performance.now();const pressed=new Set();function setDir(){direction=(pressed.has('right')?1:0)-(pressed.has('left')?1:0);hero.classList.toggle('walk',direction!==0);hero.classList.toggle('left',direction<0);status.textContent=direction?'Wandelen · 8 frames':'Stilstaan'}for(const side of ['left','right']){const el=document.getElementById(side);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);pressed.add(side);setDir()});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>{pressed.delete(side);setDir()})}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pressed.add(e.key==='ArrowLeft'?'left':'right');setDir()}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){pressed.delete(e.key==='ArrowLeft'?'left':'right');setDir()}});window.addEventListener('blur',()=>{pressed.clear();setDir()});function tick(now){let dt=Math.min(.05,(now-last)/1000);last=now;pos=Math.max(.1,Math.min(.9,pos+direction*dt*.22));hero.style.left=(pos*100)+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
