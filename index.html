</style></head><body><main><h1>SIDEWAYS · ons mannetje, 8 frames · gelijke schaal</h1><p>Houd de pijltjestoetsen of de knoppen ingedrukt om te wandelen.</p><div id="stage"><div id="ground"></div><div id="hero"></div></div><div class="controls"><button id="left">◀ Links</button><button id="right">Rechts ▶</button></div><p id="status">Stilstaan</p><p class="note">De acht afbeeldingen zijn nu naar dezelfde lichaamslengte geschaald en op dezelfde grondlijn geplaatst. De loopfasen zelf blijven voorlopig de bestaande tekeningen.</p></main><script>
const hero=document.querySelector('#hero'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let held=new Set(),x=stage.clientWidth*.38,dir=1,last=performance.now();function render(t){let dt=Math.min((t-last)/1000,.06);last=t;let d=(held.has('right')?1:0)-(held.has('left')?1:0);if(d){dir=d;x=Math.max(0,Math.min(stage.clientWidth-180,x+d*180*dt));hero.classList.add('walk');status.textContent=d>0?'Wandelen naar rechts':'Wandelen naar links'}else{hero.classList.remove('walk');status.textContent='Stilstaan'}hero.classList.toggle('left',dir<0);hero.style.left=x+'px';requestAnimationFrame(render)}requestAnimationFrame(render);function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);held.add(key)});for(let event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>held.delete(key))}bind('left','left');bind('right','right');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();held.add(e.key==='ArrowLeft'?'left':'right')}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')held.delete(e.key==='ArrowLeft'?'left':'right')});window.addEventListener('blur',()=>held.clear());</script></body></html>
