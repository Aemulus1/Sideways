<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDEWAYS — Sprite looptest</title><style>body{margin:0;background:#172238;color:white;font:16px system-ui}main{max-width:850px;margin:24px auto;padding:16px}#stage{height:350px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#87c9f5 75%,#77a86c 75%)}#hero{position:absolute;bottom:25%;left:35%;width:120px;height:220px;background-repeat:no-repeat;image-rendering:auto;transform-origin:center bottom}#hero.walk{animation:walk .8s steps(8) infinite}#hero.left{transform:scaleX(-1)}@keyframes walk{from{background-position:0 0}to{background-position:-960px 0}}button{padding:13px 22px;margin:10px 5px 0 0;background:#385f9b;color:white;border:0;border-radius:10px;font-weight:bold;touch-action:none}p{color:#c6d5eb}</style><main><h2>SIDEWAYS · Sprite-looptest</h2><div id="stage"><div id="hero"></div></div><button id="l">◀ Links</button><button id="r">Rechts ▶</button><button id="stop">Stop</button><p>Een echte 8-frame sprite-animatie met CSS steps(8). Dit is een tijdelijk bewegingsmodel, nog niet onze goedgekeurde illustratie. Gebruik ← en → of houd de knoppen ingedrukt.</p></main><script>
const W=120,H=220, sheet=document.createElement('canvas');sheet.width=W*8;sheet.height=H;const ctx=sheet.getContext('2d');
function line(x1,y1,x2,y2,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
for(let f=0;f<8;f++){ctx.save();ctx.translate(f*W,0);let t=f*Math.PI/4,s=Math.sin(t),c=Math.cos(t),bob=Math.abs(c)*3;ctx.translate(0,-bob);
// rear limbs
let hip=[61,119],shoulder=[60,68];function leg(phase,col){let a=Math.sin(t+phase)*.45,k=Math.max(0,Math.cos(t+phase))*.65;let knee=[hip[0]+Math.sin(a)*42,hip[1]+Math.cos(a)*42],ankle=[knee[0]+Math.sin(a-k)*43,knee[1]+Math.cos(a-k)*43];line(...hip,...knee,16,col);line(...knee,...ankle,13,col);line(ankle[0]-3,ankle[1]+3,ankle[0]+15,ankle[1]+3,10,'#704324')}
function arm(phase,col){let a=Math.sin(t+phase)*.55,el=[shoulder[0]-Math.sin(a)*27,shoulder[1]+Math.cos(a)*27],hand=[el[0]-Math.sin(a+.2)*26,el[1]+Math.cos(a+.2)*26];line(...shoulder,...el,13,col);line(...el,...hand,10,'#c43c30');ctx.fillStyle='#edb38e';ctx.beginPath();ctx.arc(...hand,6,0,7);ctx.fill()}
leg(Math.PI,'#25476d');arm(0,'#9e2c2a');ctx.fillStyle='#25364e';ctx.beginPath();ctx.roundRect(38,54,15,53,7);ctx.fill();ctx.fillStyle='#d43e34';ctx.beginPath();ctx.roundRect(48,56,27,63,9);ctx.fill();ctx.fillStyle='#f4e3d6';ctx.fillRect(70,65,4,42);ctx.fillStyle='#e9ae8b';ctx.fillRect(57,44,11,16);ctx.beginPath();ctx.arc(63,29,21,0,7);ctx.fill();ctx.fillStyle='#653821';ctx.beginPath();ctx.ellipse(59,16,23,12,-.2,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(80,29,2.6,0,7);ctx.fill();leg(0,'#345d89');arm(Math.PI,'#d9463c');ctx.restore()}
const hero=document.getElementById('hero');hero.style.backgroundImage=`url(${sheet.toDataURL('image/png')})`;let x=.35,dir=1,moving=false;function press(d){dir=d;moving=true;hero.classList.add('walk');hero.classList.toggle('left',d<0)}function release(){moving=false;hero.classList.remove('walk');hero.style.backgroundPosition='0 0'}function tick(){if(moving){x=Math.max(0,Math.min(.84,x+dir*.0028));hero.style.left=(x*100)+'%'}requestAnimationFrame(tick)}tick();for(let [id,d] of [['l',-1],['r',1]]){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);press(d)});b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release)}document.getElementById('stop').onclick=release;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();press(e.key==='ArrowLeft'?-1:1)}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')release()});
</script></html>
